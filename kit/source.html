<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>推しオフィス</title>
<meta name="theme-color" content="#F7F5FB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="推しオフィス">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F5FB;--paper:#fff;--ink:#1E1A2E;--mute:#6B6483;--dim:#9C96AF;--line:#E4DFF0;--plum:#8E3D8F;--violet:#4B3A8E;--lav:#EFE9F8;--lav2:#DCD2F2;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;font-size:15px;line-height:1.8;font-weight:500;-webkit-font-smoothing:antialiased;font-feature-settings:"palt";word-break:normal;line-break:strict;overflow-wrap:anywhere}
img{display:block;max-width:100%}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:1280px;margin:0 auto;padding:16px 20px 28px}
.top{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:14px}
.top h1{font-size:19px;font-weight:900;letter-spacing:-.01em}
.top .d{font-size:12px;font-weight:900;color:var(--violet);letter-spacing:.06em}
.top .st{margin-left:auto;font-size:12px;font-weight:700;color:var(--mute)}
.top .st b{color:var(--plum);font-weight:900}

/* ---- PC: 2×2の部屋タイル ---- */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.room{background:var(--paper);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:grid;grid-template-columns:200px 1fr}
.room .por{position:relative;background:linear-gradient(170deg,color-mix(in srgb,var(--c) 22%,#fff),color-mix(in srgb,var(--c) 6%,#fff))}
.room .por img{width:100%;height:100%;object-fit:cover;object-position:top}
.room .por .nd{position:absolute;top:10px;left:10px;background:var(--plum);color:#fff;font-size:10.5px;font-weight:900;border-radius:999px;padding:3px 9px}
.room .body{padding:16px 16px 14px;display:flex;flex-direction:column;min-width:0}
.room .nm{font-size:18px;font-weight:900;line-height:1.3}
.room .rl{font-size:11px;font-weight:900;color:var(--c);letter-spacing:.06em;margin-bottom:9px}
.lines{list-style:none;display:grid;gap:5px;margin-bottom:10px}
.lines li{font-size:12.8px;line-height:1.55;color:var(--mute);padding-left:14px;position:relative}
.lines li:before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--c);opacity:.45}
.lines li.need{color:var(--ink);font-weight:700}
.lines li.need:before{opacity:1}
.lines li b{color:var(--ink);font-weight:900}
.mlog{display:grid;gap:6px;margin-bottom:9px}
.mlog div{font-size:12.5px;line-height:1.6;background:var(--bg);border-left:3px solid var(--c);border-radius:3px 12px 12px 12px;padding:8px 11px}
.mlog div.me{background:var(--lav);border:0;border-radius:12px 3px 12px 12px;justify-self:end;max-width:88%}
.ask{display:flex;gap:7px;margin-top:auto}
.ask input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:9px 14px;font:inherit;font-size:13.5px;color:var(--ink)}
.ask input:focus{outline:2px solid var(--c);outline-offset:1px}
.ask button{background:var(--c);color:#fff;border:0;border-radius:999px;padding:0 15px;font-weight:900;font-size:13.5px}
.ask button:disabled{opacity:.45}
.zoom{position:absolute;right:10px;bottom:10px;background:rgba(255,255,255,.92);border:0;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:900;color:var(--ink)}
.note{font-size:11.5px;color:var(--dim);margin-top:16px}

/* ---- SP: 横スワイプのヒーロー ---- */
.swipe,.dots,.sp{display:none}
.swipe{gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -14px;padding:0 14px}
.swipe::-webkit-scrollbar{display:none}
.big{flex:0 0 calc(100% - 28px);scroll-snap-align:center;background:var(--paper);border:1px solid var(--line);border-radius:24px;overflow:hidden;position:relative}
.big .ph{position:relative;aspect-ratio:4/3;background:linear-gradient(170deg,color-mix(in srgb,var(--c) 24%,#fff),color-mix(in srgb,var(--c) 6%,#fff))}
.big .ph img{width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.big .ph .cap{position:absolute;left:0;right:0;bottom:0;padding:32px 16px 12px;background:linear-gradient(to top,rgba(255,255,255,.96) 42%,rgba(255,255,255,0))}
.big .nm{font-size:23px;font-weight:900;letter-spacing:-.02em;line-height:1.25}
.big .rl{font-size:11.5px;font-weight:900;color:var(--c);letter-spacing:.06em}
.big .nd{position:absolute;top:12px;right:12px;background:var(--plum);color:#fff;font-size:11px;font-weight:900;border-radius:999px;padding:3px 10px}
.big .bd{padding:12px 16px 16px}
.big .go{width:100%;margin-top:10px;background:var(--c);color:#fff;border:0;border-radius:14px;padding:13px;font-weight:900;font-size:14.5px}
.dots{justify-content:center;gap:7px;padding:12px 0 4px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--lav2);display:block;transition:width .2s,background .2s}
.dots i.on{width:22px;background:var(--violet)}
.sp .panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:6px}
.sp .panel h2{font-size:13px;font-weight:900;letter-spacing:.08em;color:var(--dim);margin-bottom:10px}
.sp .rep{list-style:none;display:grid;gap:8px}
.sp .rep li{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:13.5px;line-height:1.7}
.sp .rep li b{display:block;font-size:11px;font-weight:900;color:var(--dim);letter-spacing:.06em;margin-bottom:2px}
.sp .rep li.need{border-color:var(--c);background:color-mix(in srgb,var(--c) 6%,#fff)}
.sp .rep li.need b{color:var(--c)}
.sp .mlog{margin-top:10px}
.snote{font-size:11.5px;color:var(--dim);margin-top:8px}
.rows{display:grid;gap:10px}
.row{display:grid;grid-template-columns:24px 1fr 1fr;gap:8px;align-items:center;position:relative}
.row .sw{width:20px;height:20px;border-radius:50%;background:var(--c)}
.row input{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 11px;font:inherit;font-size:13.5px;min-width:0;color:var(--ink)}
.row .pick{grid-column:2/4;justify-self:start;font-size:12.5px;color:var(--dim);border:1px dashed var(--line);border-radius:10px;padding:5px 10px;cursor:pointer}
.row .pick input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.row .pick:focus-within{outline:2px solid var(--c);outline-offset:2px}
.reset{margin-top:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 13px;font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
.setnote{font-size:12px;color:var(--dim);line-height:1.7;margin-top:12px}
.oshiday{background:linear-gradient(140deg,#F4EDFC,#E6DBF7);border-radius:18px;padding:16px;margin-bottom:12px}
.oshiday b{display:block;font-size:11px;font-weight:900;letter-spacing:.1em;color:var(--plum);margin-bottom:5px}
.oshiday p{font-size:13.5px;color:var(--mute);line-height:1.7}
.oshiday a{display:inline-block;margin-top:10px;background:var(--plum);color:#fff;text-decoration:none;font-weight:900;font-size:13.5px;border-radius:999px;padding:9px 18px}

/* ---- 拡大（PC） ---- */
.veil{position:fixed;inset:0;z-index:60;background:rgba(30,26,46,.46);opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.big-modal{position:fixed;z-index:61;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);opacity:0;pointer-events:none;width:min(860px,94vw);max-height:90vh;overflow:auto;background:var(--paper);border-radius:24px;transition:transform .2s,opacity .2s}
.big-modal.on{transform:translate(-50%,-50%);opacity:1;pointer-events:auto}
.big-modal .x{position:absolute;right:14px;top:14px;background:rgba(255,255,255,.9);border:0;border-radius:999px;width:34px;height:34px;font-weight:900;font-size:16px}
.spk{background:0;border:0;padding:2px 5px;margin-left:6px;font-size:14px;line-height:1;opacity:.5;border-radius:8px;vertical-align:middle;cursor:pointer}
.spk:hover:not(:disabled){opacity:1;background:var(--lav)}
.spk:disabled{opacity:.22;cursor:default}
.hero-row{display:flex;gap:8px;align-items:center;margin-top:10px}
.hero-row .go{margin-top:0;flex:1}
.room .body .tilespk{align-self:flex-start;margin:-4px 0 8px;font-size:15px}
.hero-row .spk{flex:none;margin:0;font-size:18px;padding:11px 13px;background:var(--lav);opacity:.8;border-radius:14px}
.tabs{display:none}
@media(max-width:700px){
  body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
  .wrap{padding:12px 14px 18px}
  .grid,.note{display:none}
  .top{margin-bottom:10px}
  .top h1{font-size:16px}
  section{display:none}
  body[data-tab=room] #sec-room,body[data-tab=rep] #sec-rep,body[data-tab=need] #sec-need,
  body[data-tab=fan] #sec-fan,body[data-tab=set] #sec-set{display:block}
  body[data-tab=room] .swipe{display:flex}
  body[data-tab=room] .dots{display:flex}
  .sp{display:block}
  .big-modal{width:100%;left:0;top:auto;bottom:0;transform:translateY(102%);border-radius:22px 22px 0 0;max-height:88vh}
  .big-modal.on{transform:none}
  .tabs{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
  .tabs button{background:0;border:0;padding:9px 0 8px;font-size:10.5px;font-weight:900;color:var(--dim);display:grid;gap:3px;justify-items:center;position:relative}
  .tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .tabs button.on{color:var(--violet)}
  .tabs .dot{position:absolute;top:6px;right:50%;margin-right:-18px;width:8px;height:8px;border-radius:50%;background:var(--plum)}
}
</style></head><body data-tab="room">
<div class="wrap">
<div class="top"><span class="d" id="date"></span><h1>推しオフィス</h1><span class="st" id="st"></span></div>

<section id="sec-room">
  <div class="swipe" id="swipe"></div>
  <div class="dots" id="dots"></div>
  <div class="sp"><div class="panel" id="spPanel"></div></div>
  <div class="grid" id="grid"></div>
  <p class="note">タイルの中でそのまま相談できます。「大きく見る ↗」で部屋を広げると、報告の全文と会話が1枚になります。最初から入っている4人は、AIで描いた架空の人物です。名前も仮のもので、設定から自分の推しに入れ替えます。</p>
</section>

<section id="sec-rep"><div class="sp" id="allRep"></div></section>
<section id="sec-need"><div class="sp" id="needRep"></div></section>
<section id="sec-fan"><div class="sp"><div class="oshiday"><b>TODAY'S OSHI</b><p id="odMsg"></p><a id="odLink" target="_blank" rel="noopener">今日の1本を開く</a></div><div class="panel" id="fanPanel"></div></div></section>
<section id="sec-set"><div class="sp"><div class="panel"><h2>推しと担当を決める</h2><div class="rows" id="rows"></div>
  <button class="reset" id="picReset" hidden>選んだ写真を元に戻す</button>
  <p class="setnote" id="picNote"></p>
  <p class="setnote">ここに入れた名前と担当は、この端末だけに保存されます。最初から入っている4人は、AIで描いた架空の人物です。「写真を選ぶ」から、自分の推しの写真に入れ替えられます。写真はこの端末の中だけに保存され、どこにも送られません。</p></div></div></section>
</div>

<div class="veil" id="veil"></div>
<div class="big-modal" id="modal" role="dialog" aria-modal="true"></div>
<nav class="tabs" id="tabs"></nav>

const TTS = typeof speechSynthesis !== "undefined";
const PITCH = {s1:0.85, s2:0.90, s3:0.95, s4:1.0};
let jaVoice, _saying = "";
function pickVoice(){
  if(!TTS) return null;
  const ja = speechSynthesis.getVoices().filter(v => /^ja(-|_)?JP/i.test(v.lang) || v.lang === "ja");
  jaVoice = ja.find(v => /Otoya|Hattori|Male/i.test(v.name)) || ja[0] || null;
  return jaVoice;
}
if(TTS){ pickVoice(); speechSynthesis.addEventListener?.("voiceschanged", pickVoice); }
const staffList = () => (typeof staff !== "undefined" ? staff : OSHI);
/* text=読ませたい本文。前後に名乗りとねぎらいを足して読む。再生中に同じものを押したら止める。 */
function speak(text, id){
  if(!text || !TTS) return;
  const s = staffList().find(x => x.id === id) || OSHI.find(x => x.id === id);
  const key = id + "/" + text;
  const wasSpeaking = speechSynthesis.speaking || speechSynthesis.pending;
  speechSynthesis.cancel();
  if(wasSpeaking && _saying === key){ _saying = ""; return; }
  _saying = key;
  const u = new SpeechSynthesisUtterance(`${s?s.name:""}です。${text} 無理しないでくださいね。`);
  u.lang = "ja-JP";
  if(jaVoice || pickVoice()) u.voice = jaVoice;
  u.rate = 0.95;
  u.pitch = PITCH[id] ?? 1;
  u.onend = u.onerror = () => { _saying = ""; };
  speechSynthesis.speak(u);
}

document.addEventListener("click", e => {

}, true);

    const k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement("canvas");
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",0.82));
  };im.src=r.result};r.readAsDataURL(file)})}
const needs=s=>s.report.filter(r=>r[2]==="need").length;
const lines=(s,n=44)=>`<ul class="lines">${s.report.map(r=>`<li class="${r[2]||""}"><b>${esc(r[0])}</b>　${esc(r[1]).slice(0,n)}…</li>`).join("")}</ul>`;
const logHTML=id=>`<div class="mlog">${(history[id]||[]).slice(-4).map(m=>m.role==="user"?`<div class="me">${esc(m.content)}</div>`:`<div>${esc(m.content)}${spkBtn(oshiBy(id),m.content)}</div>`).join("")}</div>`;
const askHTML=s=>`<form class="ask" data-id="${s.id}"><input autocomplete="off" placeholder="${esc(s.name)}に相談する" aria-label="${esc(s.name)}に相談する"><button>送る</button></form>`;
const repList=list=>`<ul class="rep">${list.map(({s,r})=>`<li class="${r[2]||""}"><b>${esc(s.name)} ・ ${esc(r[0])}</b>${esc(r[1])}${spkBtn(s,r[0]+"。"+r[1])}</li>`).join("")}</ul>`;

function render(){
  const n=staff.reduce((a,s)=>a+needs(s),0);
  document.getElementById("date").textContent=todayStr();
  document.getElementById("st").innerHTML=`今日の予約 ${TODAY.booking}件 ・ 問い合わせ ${TODAY.inquiry}件 ・ <b>要相談 ${n}件</b>`;
  document.getElementById("swipe").innerHTML=staff.map(s=>`<article class="big" style="--c:${s.c}" data-id="${s.id}">
    <div class="ph"><img src="${imgSrc(s)}" alt="${esc(s.name)}の写真">${needs(s)?`<span class="nd">要相談 ${needs(s)}</span>`:""}
      <div class="cap"><div class="nm">${esc(s.name)}</div><div class="rl">${esc(s.role)}</div></div></div>
    <div class="bd">${lines(s,26)}<div class="hero-row"><button class="go" data-open="${s.id}">${esc(s.name)}に相談する</button>${spkBtn(s,s.report.map(r=>r[0]+"。"+r[1]).join(" "))}</div></div></article>`).join("");
  document.getElementById("dots").innerHTML=staff.map((s,i)=>`<i class="${i===active?"on":""}"></i>`).join("");
  document.getElementById("grid").innerHTML=staff.map(s=>`<div class="room" style="--c:${s.c}">
    <div class="por"><img src="${imgSrc(s)}" alt="${esc(s.name)}の写真">${needs(s)?`<span class="nd">要相談 ${needs(s)}</span>`:""}<button class="zoom" data-open="${s.id}">大きく見る ↗</button></div>
    <div class="body"><div class="nm">${esc(s.name)}</div><div class="rl">${esc(s.role)}</div>${lines(s)}${spkBtn(s,s.report.map(r=>r[0]+"。"+r[1]).join(" "),"tilespk")}${logHTML(s.id)}${askHTML(s)}</div></div>`).join("");
  const s=staff[active];
  document.getElementById("spPanel").innerHTML=`<h2>${esc(s.name)} の今日の報告</h2>${repList(s.report.map(r=>({s,r})))}${logHTML(s.id)}${askHTML(s)}<p class="snote">${esc(sampleNote())}</p>`;
  document.getElementById("allRep").innerHTML=staff.map(x=>`<div class="panel" style="--c:${x.c}"><h2>${esc(x.name)} ・ ${esc(x.role)}</h2>${repList(x.report.map(r=>({s:x,r})))}</div>`).join("");
  const nd=staff.flatMap(x=>x.report.filter(r=>r[2]==="need").map(r=>({s:x,r})));
  document.getElementById("needRep").innerHTML=`<div class="panel" style="--c:var(--plum)"><h2>要相談 ${nd.length}件</h2>${repList(nd)}</div>`;
  const j=staff[2];
  document.getElementById("odMsg").textContent=TODAY.oshiMsg;document.getElementById("odLink").href=TODAY.oshiLink;
  document.getElementById("fanPanel").innerHTML=`<h2>${esc(j.name)} ・ ${esc(j.role)}</h2>${repList(j.report.map(r=>({s:j,r})))}${logHTML(j.id)}${askHTML(j)}`;
  document.getElementById("rows").innerHTML=staff.map((x,i)=>`<div class="row" style="--c:${x.c}"><span class="sw"></span><input id="nm${i}" value="${esc(x.name)}" aria-label="${i+1}人目の推しの名前"><input id="rl${i}" value="${esc(x.role)}" aria-label="${i+1}人目の担当"><label class="pick"><input type="file" accept="image/*" data-pic="${x.id}" aria-label="${i+1}人目の推しの写真を選ぶ">${imgs[x.id]?"写真を変える":"写真を選ぶ"}</label></div>`).join("");
  document.getElementById("picReset").hidden=!Object.keys(imgs).length;
  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${document.body.dataset.tab===k?"on":""}"><svg viewBox="0 0 24 24">${ICON[k]}</svg>${l}${k==="need"&&n?'<span class="dot"></span>':""}</button>`).join("");
}
function openModal(id){
  const s=staff.find(x=>x.id===id),m=document.getElementById("modal");m.style.setProperty("--c",s.c);
  m.innerHTML=`<div class="room" style="border:0;border-radius:0;--c:${s.c}"><div class="por"><img src="${imgSrc(s)}" alt="">${needs(s)?`<span class="nd">要相談 ${needs(s)}</span>`:""}</div>
   <div class="body"><button class="x" id="x" aria-label="閉じる">×</button><div class="nm">${esc(s.name)}</div><div class="rl">${esc(s.role)}</div>
   ${repList(s.report.map(r=>({s,r})))}${logHTML(s.id)}${askHTML(s)}<p class="snote">${esc(sampleNote())}</p></div></div>`;
  document.getElementById("veil").classList.add("on");m.classList.add("on");
}
function close(){document.getElementById("veil").classList.remove("on");document.getElementById("modal").classList.remove("on");render()}
document.body.addEventListener("click",e=>{
  const o=e.target.closest("[data-open]");if(o){openModal(o.dataset.open);return}
  const t=e.target.closest(".tabs button");if(t){document.body.dataset.tab=t.dataset.tab;render();scrollTo(0,0);return}
  if(e.target.id==="veil"||e.target.id==="x")close();
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")close()});
document.getElementById("swipe").addEventListener("scroll",()=>{
  const el=document.getElementById("swipe"),i=Math.round(el.scrollLeft/(el.firstElementChild.offsetWidth+12));
  if(i!==active&&staff[i]){active=i;render()}
},{passive:true});
document.body.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target.closest(".ask");if(!f)return;
  const s=staff.find(x=>x.id===f.dataset.id),inp=f.querySelector("input"),btn=f.querySelector("button");
  const text=inp.value.trim();if(!text)return;inp.value="";
  history[s.id]=history[s.id]||[];history[s.id].push({role:"user",content:text});
  const log=f.previousElementSibling;
  log.insertAdjacentHTML("beforeend",`<div class="me">${esc(text)}</div>`);
  const out=document.createElement("div");out.textContent="考え中…";log.appendChild(out);btn.disabled=true;
  const r=await askOshi(s,history[s.id],x=>out.textContent=x);
  out.textContent=r;out.insertAdjacentHTML("beforeend",spkBtn(s,r));history[s.id].push({role:"assistant",content:r});btn.disabled=false;
  document.querySelectorAll(".snote").forEach(p=>p.textContent=sampleNote());
});
document.getElementById("rows").addEventListener("change",async e=>{
  const f=e.target.closest("[data-pic]");if(!f||!f.files[0])return;
  const note=document.getElementById("picNote");
  try{imgs[f.dataset.pic]=await shrink(f.files[0]);note.textContent=saveImgs()}
  catch(err){note.textContent="この写真は読み込めませんでした。別の画像で試してください。"}
  render();
});
document.getElementById("picReset").addEventListener("click",()=>{
  imgs={};try{localStorage.removeItem("oshi-office-img")}catch(e){}
  document.getElementById("picNote").textContent="";render();
});
document.getElementById("rows").addEventListener("input",()=>{staff.forEach((x,i)=>{x.name=document.getElementById("nm"+i).value.trim()||OSHI[i].name;x.role=document.getElementById("rl"+i).value.trim()||OSHI[i].role});save();render()});
render();
</script>
</body></html>
